name: Release

# Continuous delivery: тег вида v1.2.3 → прогон CI → GitHub Release с
# собранным фронтендом и обученной моделью.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: ci
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: frontend-build
          path: frontend-build

      - name: Package assets
        run: |
          mkdir dist
          (cd frontend-build && zip -qr ../dist/frontend-build-${GITHUB_REF_NAME}.zip .)
          cp burnout_model.pkl burnout_model.meta.json dist/
          sha256sum dist/* > dist/SHA256SUMS.txt

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "$GITHUB_REF_NAME" dist/*
          --title "$GITHUB_REF_NAME"
          --generate-notes
