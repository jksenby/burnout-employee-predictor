[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.coverage.run]
source = ["."]
omit = ["tests/*", "frontend/*", "scripts/*"]

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = ["frontend"]

[tool.ruff.lint]
# Ошибки, которые ломают код во время выполнения: синтаксис, неопределённые
# имена, неиспользуемые импорты и переменные. Стилевые правила не включены
# намеренно — код писался без форматтера, и массовая переформатировка
# смешала бы историю изменений с реальными правками.
select = ["E9", "F"]
